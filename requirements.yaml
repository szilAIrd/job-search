# Job Search Requirements
#
# Edit this file to customize what jobs the agent searches for.
# The agent reads this file on every run.

# --- Keywords to search for (any match) ---
keywords:
  - renewable energy
  - simulation
  - matlab

# --- Locations to search (leave empty for remote-only) ---
locations:
  - Remote
  - vienna

# --- Required skills (ALL must appear in job description) ---
required_skills:

# --- Nice-to-have skills (used for ranking, not filtering) ---
preferred_skills:

# --- Minimum experience years (0 = no filter) ---
min_experience_years: 0

# --- Job types ---
job_types:

# --- Sources to scrape ---
sources:
  - remotive       # https://remotive.com  (remote jobs, free API)
  - arbeitnow      # https://www.arbeitnow.com (EU-focused, free API)
  - jobicy         # https://jobicy.com (remote jobs, free API)
  - weworkremotely # https://weworkremotely.com (remote jobs, free RSS)
  - themuse        # https://www.themuse.com (global jobs, free API)
  - linkedin       # https://www.linkedin.com (global jobs, free API)
  - https://climatebase.org/  # https://www.climatebase.org (global jobs, free API)
